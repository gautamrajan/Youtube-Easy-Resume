name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag and main ancestry
        run: |
          npm run verify:release-tag -- "$GITHUB_REF_NAME"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Test and package both browsers
        run: npm run check

      - name: Prepare release notes and AMO source
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build/release
          node scripts/release-notes.mjs "$VERSION" > build/release/notes.md
          git archive --format=zip \
            --prefix="youtube-easy-resume-$VERSION-source/" \
            --output="build/release/youtube-easy-resume-$VERSION-source.zip" \
            "$GITHUB_SHA"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/artifacts/chrome/youtube-easy-resume-$VERSION-chrome.zip" \
            "build/artifacts/firefox/youtube-easy-resume-$VERSION-firefox.zip" \
            "build/release/youtube-easy-resume-$VERSION-source.zip" \
            --verify-tag \
            --title "YouTube Easy Resume $VERSION" \
            --notes-file build/release/notes.md
